# ------------------------------------------------------------
# EXCHANGES
# ------------------------------------------------------------
exchanges:
  priority:
    - okx
    - kraken
    - mexc
    - kucoin
    - gateio
    - bitget
  blocked:
    - binance
    - bybit
  rate_limit: true
  timeout_ms: 30000
  max_retries: 3
  max_exchanges: 3

# ------------------------------------------------------------
# TIMEFRAMES
# ------------------------------------------------------------
timeframes:
  entry: "5m"
  confirm: "15m"
  trend: "1h"
  history_limit: 2000
  min_bars_required: 200

# ------------------------------------------------------------
# SCORING — PESOS OPTIMIZADOS
# ------------------------------------------------------------
scoring:
  weights:
    trend: 0.17
    momentum: 0.15
    volume_intelligence: 0.40
    volatility: 0.11
    liquidity: 0.10
    regime: 0.07
    # Suma: 1.00 ✓
  auto_normalize: true
  normalization: "robust"
  robust_epsilon: 1.0e-9
  calibration:
    enabled: true
    method: "isotonic"
    min_samples: 50
  sub_weights:
    volume:
      tfi: 0.35
      ofi: 0.25
      rvol: 0.25
      cvd: 0.15
      # Suma: 1.00 ✓

# ------------------------------------------------------------
# UMBRALES DINÁMICOS POR RÉGIMEN
# ------------------------------------------------------------
thresholds:
  regime_thresholds:
    Expansion:    {min_score: 75, min_adx: 20, min_rvol: 1.5}
    Trend_Strong: {min_score: 75, min_adx: 25, min_rvol: 1.5}
    Trend_Weak:   {min_score: 70, min_adx: 20, min_rvol: 1.8}
    Chop:         {min_score: 65, min_adx: 15, min_rvol: 2.0}
  min_prob_directional: 0.60
  max_cost_pct: 0.0016
  min_expected_move_pct: 0.0032   # 2× costo round trip

# ------------------------------------------------------------
# GESTIÓN DE RIESGO
# ------------------------------------------------------------
risk:
  initial_capital: 10000.0
  risk_per_trade: 0.01
  max_concurrent_positions: 3
  max_daily_drawdown: 0.03
  max_leverage: 10
  use_volatility_sizing: true
  leverage_by_score:
    "90-100": 5
    "85-90": 4
    "80-85": 3
    "75-80": 2
    "0-75": 1

  stop_loss:
    method: "atr"
    atr_mult_default: 1.8
    atr_mult_by_symbol:
      BTC/USDT: 1.8
      ETH/USDT: 1.8
      BNB/USDT: 1.8
      XRP/USDT: 1.5
      SOL/USDT: 2.0
      TRX/USDT: 2.0
      ZEC/USDT: 2.5
      DOGE/USDT: 2.5
      XMR/USDT: 2.0
      LINK/USDT: 2.0
      ADA/USDT: 2.0
      XLM/USDT: 2.0
      BCH/USDT: 2.0
      TON/USDT: 2.0
      LTC/USDT: 2.0
      NEAR/USDT: 2.5
      SUI/USDT: 2.5
      DOT/USDT: 2.0
      ETC/USDT: 2.0
      KAS/USDT: 2.5
      ALGO/USDT: 2.5
      QNT/USDT: 2.5
      ATOM/USDT: 2.0
      DASH/USDT: 2.5
      VET/USDT: 2.5
      FIL/USDT: 2.5
      STX/USDT: 2.5
      TIA/USDT: 2.5
      DCR/USDT: 2.5
      XTZ/USDT: 2.0
      default: 2.0
    min_pct: 0.0015
    max_pct: 0.0200

  take_profit:
    method: "atr"
    atr_mult_default: 2.5
    min_pct: 0.0030

  trailing:
    atr_mult_default: 2.0
    atr_mult_by_symbol:
      BTC/USDT: 1.8
      ETH/USDT: 1.8
      BNB/USDT: 1.8
      XRP/USDT: 1.5
      SOL/USDT: 2.0
      TRX/USDT: 2.0
      ZEC/USDT: 2.5
      DOGE/USDT: 2.5
      XMR/USDT: 2.0
      LINK/USDT: 2.0
      ADA/USDT: 2.0
      XLM/USDT: 2.0
      BCH/USDT: 2.0
      TON/USDT: 2.0
      LTC/USDT: 2.0
      NEAR/USDT: 2.5
      SUI/USDT: 2.5
      DOT/USDT: 2.0
      ETC/USDT: 2.0
      default: 2.0
    floor: 0.03
    cap: 0.08
    activation_atr: 0.50
    breakeven_trigger_atr: 0.25

# ------------------------------------------------------------
# COSTOS OPERATIVOS
# ------------------------------------------------------------
costs:
  fee_per_side: 0.0005
  slippage: 0.0003
  spread: 0.0002
  funding_rate_8h: 0.0001

# ------------------------------------------------------------
# BACKTEST Y VALIDACIÓN
# ------------------------------------------------------------
backtest:
  min_history_days: 180
  default_scan_every_n_bars: 5
  max_symbols_backtest: 20
  walk_forward:
    train_months: 3
    test_months: 1
    purge_bars: 48
  monte_carlo:
    n_simulations: 10000
    random_seed: 42
  deflated_sharpe:
    enabled: true
    min_dsr: 0.0
    max_p_value: 0.05

# ------------------------------------------------------------
# OPTIMIZACIÓN
# ------------------------------------------------------------
optimization:
  method: "bayesian"
  n_calls: 50
  n_initial_points: 10
  objective: "composite"
  objective_weights:
    sharpe: 0.40
    profit_factor: 0.30
    max_drawdown: 0.30

# ------------------------------------------------------------
# DIRECTORIOS
# ------------------------------------------------------------
directories:
  cache: "./cache"
  data: "./data"
  logs: "./logs"
  reports: "./reports"

# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/scanner.log"
  max_bytes: 10485760
  backup_count: 5

# ------------------------------------------------------------
# TIER THRESHOLDS
# ------------------------------------------------------------
tiers:
  OMEGA: 90.0
  S: 80.0
  A: 70.0
  B: 60.0
  NO_TRADE: 0.0

# ------------------------------------------------------------
# LÍMITES DE SEGURIDAD
# ------------------------------------------------------------
safety:
  max_position_size_pct: 0.10
  max_total_exposure: 0.50
  circuit_breaker_dd: 0.10
  min_time_between_trades: 300
  require_confirmation: true

runtime:
  python_version: "3.11"
  pyarrow_max: "24.0.0"
